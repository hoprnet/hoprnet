[package]
name = "hopr-crypto-packet"
version = "1.4.0"
description = "Contains high-level HOPR protocol building blocks for packet interaction"
edition.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["hopr", "crypto", "sphinx", "mixnet"]
repository.workspace = true
homepage.workspace = true
categories = ["cryptography", "network-programming"]
authors.workspace = true
rust-version.workspace = true
include = [
  "README.md",
  "src/**/*.rs",
  "benches/**/*.rs",
  "Cargo.toml",
  "LICENSE",
]

[lib]
crate-type = ["rlib"]
doctest = false

[features]
default = ["rayon", "ed25519", "pix-bjj"]
all-benchmarks = []

rayon = ["hopr-utils/parallelize-rayon"]
ed25519 = []
x25519 = []
secp256k1 = []
# Selects the BabyJubJub instantiation of `HoprPixSpec`, and with it BabyJubJub deposit
# addresses. Default, because it is what production settles.
#
# THE CURVE IS A NETWORK-WIDE INVARIANT, NOT A PER-NODE CHOICE. It sets the width of every
# curve-sized field in the PIX handshake — each coefficient commitment (32 B here, 33 B on
# secp256k1) and the commitment proof of knowledge (64 B / 65 B) — and `StartProtocol` derives its
# `SsaCommit` and `SsaRequest` layouts and chunking from those sizes while advertising one protocol
# version regardless. Two peers built for different curves therefore cannot run a PIX Session
# together. Each node announces its curve as a `PixSuite` in the negotiated `PixParams`, so the Exit
# refuses a mismatched client with `UnacceptablePixParams` at Session establishment rather than
# leaving it to fail as malformed Start traffic — but it is a refusal, not a negotiation: nothing
# adapts, and both ends of a deployment must be built the same way.
#
# One case is not covered, because it cannot be: a node built before the suite field existed
# announces all-zero bits, which read as BabyJubJub. Such a node built for secp256k1 is therefore
# indistinguishable from a BabyJubJub one and still fails later, on the curve-sized fields. New
# against new, and new against old-BabyJubJub, are both clean.
pix-bjj = []
# Overrides `pix-bjj` back to the secp256k1 instantiation, giving Ethereum deposit addresses that
# a plain `HoprToken.transfer` can reach. Not default, and deliberately an *override* rather
# than a peer of `pix-bjj`: Cargo features are additive, so `default-features = false` is only
# effective while every crate in the graph agrees to it, and one dependency that forgets
# silently re-enables `pix-bjj` for everyone. That is not hypothetical — it is how hoprnet
# 27b4b255f9 turned every hoprd deposit address into a curve point no transfer could reach,
# with no build error and no runtime error beyond a strategy that quietly never deposited.
# A feature that wins *on addition* cannot be defeated that way.
#
# Note this is `pix-secp256k1`, not `secp256k1`: that name is taken above and selects the
# Sphinx header curve, which is an unrelated axis. Sharing it would make enabling one silently
# switch the other — the same defect one layer along.
#
# Enabling it is a decision about the whole deployment, not about this node's settlement: see
# `pix-bjj` for why a peer on the other curve cannot establish a PIX Session at all. A consumer that
# needs Ethereum deposit addresses needs every node it talks PIX to built the same way.
pix-secp256k1 = []
serde = [
  "dep:serde",
  "dep:serde_bytes",
  "flagset/serde",
  "hopr-protocol-pix/serde",
  "hopr-types/serde",
]
allocator-mimalloc = [
  "dep:mimalloc",
] # Use mimalloc as the global allocator on Linux
allocator-jemalloc = [
  "dep:tikv-jemallocator",
] # Use jemalloc as the global allocator on Linux

[dependencies]
const-hex = { workspace = true }
flagset = { workspace = true }
strum = { workspace = true }
serde = { workspace = true, optional = true }
serde_bytes = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }

bimap = { workspace = true }
subtle = { workspace = true }

hopr-protocol-pix = { workspace = true }
hopr-utils = { workspace = true, features = ["parallelize"] }
hopr-types = { workspace = true, features = [
  "crypto",
  "random",
  "internal",
  "primitive",
] }

[dev-dependencies]
anyhow = { workspace = true }
criterion = { workspace = true }
hex-literal = { workspace = true }
lazy_static = { workspace = true }
parameterized = { workspace = true }
postcard = { workspace = true }
tokio = { workspace = true }

[[bench]]
name = "packet_bench"
harness = false

[[bench]]
name = "por_bench"
harness = false

[[bench]]
name = "validation_bench"
harness = false

[package.metadata.cargo-machete]
ignored = ["serde_bytes"]

[package.metadata.cargo-shear]
ignored = ["serde_bytes"]

# Target-specific dependencies for memory allocators
[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, optional = true }
