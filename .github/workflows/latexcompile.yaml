---
#################################################################################
# Pipeline generate the Yellowpaper
#################################################################################
name: Yellowpaper

on:
  push:
    branches:
      - 'master'
      - 'yellowpaper/**'
    paths:
      - '!docs/yellowpaper/yellowpaper.pdf'
      - 'docs/yellowpaper/**'
      - '.github/workflows/latexcompile.yaml'

permissions:
  contents: read

jobs:
  build_latex:
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo: true
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Git info
        run: |
          git config user.email "tech@hoprnet.org"
          git config user.name "HOPR CI robot"
          git config pull.rebase false

      - name: Install dependencies
        run: >
          sudo apt -y install texlive texlive-latex-extra texlive-science texlive-bibtex-extra latexmk #magic___^_^___line
      - name: Compile LaTeX document
        run: make -j build-yellowpaper

      - name: Commit & Push changes
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          new_branch: ${{ github.ref }}
          message: 'chore(build): update yellowpaper'
          pathspec_error_handling: exitImmediately
