---
################################################################################
# Pull request pipeline for hoprnet
#
# Single orchestrator: dispatches checks, tests, builds, and dappnode.
################################################################################
name: PR

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-pr
  cancel-in-progress: true

jobs:
  validate-pr-title:
    name: Validate title
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            build
            chore
            docs
            style
            refactor
            perf
            test
            ci
            revert
          requireScope: false
          ignoreLabels: |
            bot
            ignore-semantic-pull-request

  label:
    name: Add labels
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/labeler@77a4082b841706ac431479b7e2bb11216ffef250 # main on 20.02.2025
        with:
          sync-labels: true

      - name: Add "external" label for forked PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            gh pr edit "$PR_NUMBER" --add-label "external"
          fi

  # Gate jobs through inputs on the reusable workflows, not with a caller-level
  # `if:`: an input-skipped inner job still reports its check name as skipped
  # (green), a skipped caller job does not. Merge-queue runs always run
  # everything. Only `docs/**` counts as non-code; format and pre-commit
  # cover every file type and always run.
  changes:
    name: Detect changes
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      lockfile: ${{ github.event_name != 'pull_request' || steps.filter.outputs.lockfile == 'true' }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - "**"
              - "!docs/**"
            lockfile:
              - "Cargo.toml"
              - "**/Cargo.toml"
              - "Cargo.lock"
              - ".cargo/**"
              - "flake.nix"
              - "flake.lock"
              - ".github/workflows/**"

  check-allowed-dependencies:
    name: Disallowed git dependencies in cargo
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Validate Cargo dependencies
        uses: hoprnet/hopr-workflows/actions/nix-action@3ee95c480962bb3c1fc0061887da9ba735f537c7 # nix-action-v1
        with:
          source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          command: |
            nix develop -c env -u VIRTUAL_ENV UV_CACHE_DIR=.ci/no-git-dependencies/.uv-cache \
              uv run --project .ci/no-git-dependencies \
              python .ci/no-git-dependencies/src/no_git_dependencies_check/main.py

  checks:
    name: Check
    # Stage 1: with check-allowed-dependencies and changes.
    needs: changes
    uses: hoprnet/hopr-workflows/.github/workflows/checks.yaml@3ee95c480962bb3c1fc0061887da9ba735f537c7 # workflow-checks-v2
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      lint_command: "nix build -L .#workspace-clippy"
      lint: ${{ needs.changes.outputs.code == 'true' }}
      deps: ${{ needs.changes.outputs.code == 'true' }}
      audit: ${{ needs.changes.outputs.lockfile == 'true' }}
      runner_small: depot-ubuntu-24.04
      runner_large: depot-ubuntu-24.04-4
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  tests:
    name: Test
    # Stage 2: tests run only after the stage 1 checks are green.
    needs: [changes, checks, check-allowed-dependencies]
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload in the coverage jobs
    uses: hoprnet/hopr-workflows/.github/workflows/tests.yaml@3ee95c480962bb3c1fc0061887da9ba735f537c7 # workflow-tests-v6
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      # Coverage runs the same nextest selection as test-unit and test-integration
      # (--lib / --test '*' with identical features and profile), so the plain
      # test jobs would run every test twice. Nightly stays: other toolchain.
      enable_unit_tests: false
      enable_integration_tests: false
      enable_nightly_tests: ${{ needs.changes.outputs.code == 'true' }}
      nightly_test_command: "nix build -L .#test-nightly"
      enable_benchmarks: false
      enable_unit_coverage: ${{ needs.changes.outputs.code == 'true' }}
      enable_integration_coverage: ${{ needs.changes.outputs.code == 'true' }}
      unit_coverage_command: "nix build -L .#coverage-unit -o coverage.lcov"
      integration_coverage_command: "nix build -L .#coverage-integration -o coverage.lcov"
      runner_unit: depot-ubuntu-24.04-16
      runner_integration: depot-ubuntu-24.04-8
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  benchmarks:
    name: Benchmarks
    # Stage 3: `tests` itself waits for the stage 1 jobs.
    needs: [tests]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: hoprnet/hopr-workflows/.github/workflows/benchmarks.yaml@c06be87b06af5bfcc48d98ebe95787c994e2d2c0 # workflow-benchmark-v1
    with:
      source_branch: ${{ github.event.pull_request.head.ref }}
      runner: self-hosted-hoprnet-bigger
      bencher_project: ${{ github.event.repository.name }}
      # Benchmarks disabled for now — flip the should_build to true
      should_build: false
      should_run: false
      build_command: "nix build -L .#bench-build"
      run_command: "nix run .#bench-run"
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}

  build-library:
    name: Verify publish dry-run
    # Stage 3: builds run only after stage 1 (checks) and stage 2 (tests) are green.
    # When the path filter skips `tests`, `enabled` is false here too.
    needs: [changes, checks, check-allowed-dependencies, tests]
    uses: hoprnet/hopr-workflows/.github/workflows/build-library.yaml@3d291616a704bea189af1f16cefc25e26d2857c0 # build-library-v3
    permissions:
      contents: read
      id-token: write
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      version_type: pr
      architecture: x86_64-linux
      runner: depot-ubuntu-24.04-4
      enabled: ${{ needs.changes.outputs.code == 'true' }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  docs:
    name: Docs
    # Stage 3, same rule as build-library.
    needs: [changes, checks, check-allowed-dependencies, tests]
    if: needs.changes.outputs.code == 'true'
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Build docs
        uses: hoprnet/hopr-workflows/actions/nix-action@3ee95c480962bb3c1fc0061887da9ba735f537c7 # nix-action-v1
        with:
          source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          command: |
            nix build -L .#docs
