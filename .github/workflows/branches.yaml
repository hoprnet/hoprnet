---
name: Branches

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: branches-${{ github.ref_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  coverage:
    name: Coverage
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload
    uses: hoprnet/hopr-workflows/.github/workflows/tests.yaml@43c833e72dffe4f2f3be60193733e5657f8aa0d7 # workflow-tests-v7.0.0
    with:
      repo_sha: ${{ github.sha }}
      enable_unit_tests: false
      enable_integration_tests: false
      enable_nightly_tests: false
      enable_benchmarks: false
      enable_unit_coverage: true
      enable_integration_coverage: true
      unit_coverage_command: "nix build -L .#coverage-unit -o coverage.lcov"
      integration_coverage_command: "nix build -L .#coverage-integration -o coverage.lcov"
      runner_unit: depot-ubuntu-24.04-16
      runner_integration: depot-ubuntu-24.04-8
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  benchmarks:
    name: Benchmarks
    needs: coverage
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: hoprnet/hopr-workflows/.github/workflows/benchmarks.yaml@43c833e72dffe4f2f3be60193733e5657f8aa0d7 # workflow-benchmarks-v3.0.0
    with:
      repo_sha: ${{ github.sha }}
      runner: self-hosted-hoprnet-bigger
      bencher_project: ${{ github.event.repository.name }}
      # Benchmarks disabled for now — flip these two booleans back to re-enable.
      should_build: false
      should_run: false
      build_command: "nix build -L .#bench-build"
      run_command: "nix run .#bench-run"
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      bencher_api_token: ${{ secrets.BENCHER_API_TOKEN }}
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
