[package]
name = "hopr-transport-mixer"
description = "Mixer functionality responsible for mixing and delaying packets with a channel-like interface"
version = "1.0.0"
edition.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["hopr", "transport", "mixer"]
repository.workspace = true
homepage.workspace = true
categories = ["network-programming", "asynchronous"]
authors.workspace = true
rust-version.workspace = true
include = [
  "README.md",
  "src/**/*.rs",
  "benches/**/*.rs",
  "Cargo.toml",
  "LICENSE",
]

[lib]
crate-type = ["rlib"]

[features]
# The shared-pool timing-wheel engine is the default mixer implementation.
default = ["poisson"]
# Virtual-clock timing-wheel release engine: pool behind Arc<Mutex>, sweep runs on the consumer
# (no dedicated thread or relay channels) — `poisson_channel`.
poisson = ["dep:parking_lot"]
# Uniform-delay min-heap channel — `channel`.
uniform-channel = ["dep:parking_lot"]
# Uniform-delay `Sink` adapter — `MixerSink`.
uniform-adapter = []
telemetry = ["hopr-types/telemetry", "dep:lazy_static"]
serde = ["dep:serde", "dep:humantime-serde"]

[dependencies]
futures = { workspace = true }
futures-timer = { workspace = true }
humantime-serde = { workspace = true, optional = true }
lazy_static = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
smart-default = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
validator = { workspace = true }

hopr-types = { workspace = true, features = ["random"] }

[dev-dependencies]
anyhow = { workspace = true }
bytesize = { workspace = true }
criterion = { workspace = true, features = ["async_futures", "async_tokio"] }
futures = { workspace = true }
insta = { workspace = true, features = ["yaml"] }
rstest = { workspace = true }
rust-stream-ext-concurrent = { workspace = true }
tokio = { workspace = true, features = ["time"] }
[package.metadata.cargo-machete]
ignored = ["humantime-serde"]

[package.metadata.cargo-shear]
ignored = ["humantime-serde"]

[[bench]]
name = "mixer_throughput_bench"
harness = false
# Compares the uniform-engine variants (sink + channel); poisson has its own bench.
required-features = ["uniform-channel", "uniform-adapter"]

[[bench]]
name = "poisson_bench"
harness = false
required-features = ["poisson"]
