[package]
name = "hopr-transport-mixer"
description = "Mixer functionality responsible for mixing and delaying packets with a channel-like interface"
version = "0.5.0"
edition.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["hopr", "transport", "mixer"]
repository.workspace = true
homepage.workspace = true
categories = ["network-programming", "asynchronous"]
authors.workspace = true
rust-version.workspace = true
include = [
  "README.md",
  "src/**/*.rs",
  "benches/**/*.rs",
  "Cargo.toml",
  "LICENSE",
]

[lib]
crate-type = ["rlib"]

[features]
# The Poisson engine is the default mixer implementation.
default = ["poisson"]
all-benchmarks = []
# Exponential (Poisson) release engine — `poisson_channel`.
poisson = ["dep:async-channel", "futures/executor"]
# Uniform-delay min-heap channel — `channel`.
uniform-channel = ["dep:parking_lot", "dep:tracing"]
# Uniform-delay `Sink` adapter — `MixerSink`.
uniform-adapter = ["dep:tracing"]
telemetry = ["hopr-types/telemetry", "dep:lazy_static"]
serde = ["dep:serde", "dep:humantime-serde"]

[dependencies]
async-channel = { workspace = true, optional = true }
futures = { workspace = true }
futures-timer = { workspace = true }
humantime-serde = { workspace = true, optional = true }
lazy_static = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
smart-default = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }

hopr-types = { workspace = true, features = ["random"] }

[dev-dependencies]
anyhow = { workspace = true }
bytesize = { workspace = true }
criterion = { workspace = true, features = ["async_futures", "async_tokio"] }
futures = { workspace = true }
insta = { workspace = true, features = ["yaml"] }
rstest = { workspace = true }
rust-stream-ext-concurrent = { workspace = true }
tokio = { workspace = true, features = ["time"] }
[package.metadata.cargo-machete]
ignored = ["humantime-serde"]

[[example]]
name = "mixing_quality"
required-features = ["poisson"]

[[bench]]
name = "mixer_throughput_bench"
harness = false
# Compares all three implementations, so it needs every mixer feature enabled.
required-features = ["poisson", "uniform-channel", "uniform-adapter"]
