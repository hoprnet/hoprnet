[package]
name = "hopr-transport-session"
description = "Session functionality providing session abstraction over the HOPR transport"
version = "0.23.3"
edition.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["hopr", "transport", "session"]
repository.workspace = true
homepage.workspace = true
categories = ["network-programming", "asynchronous"]
authors.workspace = true
rust-version.workspace = true
include = [
  "README.md",
  "src/**/*.rs",
  "benches/**/*.rs",
  "Cargo.toml",
  "LICENSE",
]

[lib]
crate-type = ["rlib"]
doctest = false

[features]
default = []
all-benchmarks = []
benchmark = []
# Test scaffolding: the manual `MsgSender` mock and the packet-planning driver, exposed as
# `hopr_transport_session::testing`.
#
# Behind a feature because it is the only reason `mockall` and `tokio` would be needed at all: with
# the module compiled unconditionally both had to be non-optional, so a release build linked a
# mocking framework and `tokio` fell out of `runtime-tokio`, taking the crate's runtime-agnostic
# boundary with it.
#
# The dev-dependency on this crate below is what makes `cargo test` work: `#[cfg(test)]` alone
# enables no features, so the module would compile without its dependencies — which is exactly the
# state `hopr-lib`'s `testing` module is stuck in.
testing = ["dep:mockall", "dep:tokio"]
runtime-tokio = [
  "dep:tokio",
  "crossfire/tokio",
  "hopr-utils/network-types-runtime-tokio",
  "hopr-protocol-session/runtime-tokio",
]
telemetry = [
  "hopr-utils/network-types-telemetry",
  "hopr-protocol-session/telemetry",
  "hopr-api/types-telemetry",
  "dep:lazy_static",
]
allocator-mimalloc = [
  "dep:mimalloc",
] # Use mimalloc as the global allocator on Linux
allocator-jemalloc = [
  "dep:tikv-jemallocator",
] # Use jemalloc as the global allocator on Linux

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
crossfire = { workspace = true }
flagset = { workspace = true, features = ["serde"] }
futures = { workspace = true }
humantime-serde = { workspace = true }
futures-time = { workspace = true }
lazy_static = { workspace = true, optional = true }
moka = { workspace = true }
parking_lot = { workspace = true }
pid = { workspace = true }
pin-project = { workspace = true }
serde = { workspace = true }
serde_repr = { workspace = true }
smart-default = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, optional = true }
mockall = { workspace = true, optional = true }

hopr-api = { workspace = true, features = ["types-random"] }
hopr-utils = { workspace = true, features = [
  "network-types",
  "network-types-serde",
] }
hopr-crypto-packet = { workspace = true }
hopr-protocol-app = { workspace = true, features = ["serde"] }
hopr-protocol-pix = { workspace = true, features = ["serde"] }
hopr-protocol-session = { workspace = true, features = ["serde", "hashbrown"] }
hopr-protocol-start = { workspace = true }

[dev-dependencies]
# Self dev-dependency, so the `testing` feature is on for the lib's own test target and for the
# integration tests in `tests/`. Without it `#[cfg(test)]` would compile the module while `mockall`
# and `tokio` stayed disabled.
hopr-transport-session = { path = ".", features = ["testing"] }
criterion = { workspace = true }
futures-time = { workspace = true }
hopr-api = { workspace = true, features = ["types-random"] }
hopr-utils = { workspace = true, features = [
  "runtime-tokio",
  "network-types",
  "network-types-runtime-tokio",
  "network-types-serde",
] }
hopr-protocol-session = { workspace = true, features = [
  "session-types",
  "serde",
  "runtime-tokio",
  "hashbrown",
] }
insta = { workspace = true, features = ["yaml"] }
mockall = { workspace = true }
rand = { workspace = true }
test-log = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["serde_with", "humantime-serde"]

[[bench]]
name = "session_bench"
harness = false
required-features = ["benchmark"]

[[bench]]
name = "dispatch_bench"
harness = false
required-features = ["benchmark"]

# Target-specific dependencies for memory allocators
[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, optional = true }
