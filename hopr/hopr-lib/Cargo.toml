[package]
name = "hopr-lib"
description = "HOPR library implementing the HOPR protocol"
version = "5.0.0-rc.2"
edition.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["hopr", "mixnet", "libp2p", "privacy"]
repository.workspace = true
homepage.workspace = true
categories = ["network-programming", "cryptography"]
authors.workspace = true
rust-version.workspace = true
include = ["README.md", "src/**/*.rs", "Cargo.toml", "LICENSE"]

[lib]
crate-type = ["rlib"]
doctest = false

[[test]]
name = "api_general"
required-features = ["testing"]

[[test]]
name = "chain_operations-size2"
required-features = ["testing"]

[[test]]
name = "chain_operations-size3"
required-features = ["testing"]

[[test]]
name = "cluster_throughput-size3"
required-features = ["testing"]

[[test]]
name = "transport_liveness-size3"
required-features = ["testing"]

[[test]]
name = "transport_p2p-size3"
required-features = ["testing"]

[[test]]
name = "transport_session"
required-features = ["testing"]

[[test]]
name = "transport_session-size3"
required-features = ["testing"]

[[test]]
name = "transport_session_pix"
required-features = ["testing"]

[[test]]
name = "transport_tickets"
required-features = ["testing"]

[[test]]
name = "cluster_throughput-size5"
required-features = ["testing"]

[[test]]
name = "cluster_throughput-matrix"
required-features = ["testing"]

[[example]]
name = "cluster_throughput"
required-features = ["testing"]


[features]
capture = ["hopr-transport/capture"]
default = ["pix-bjj", "transport-announce-quic"]
# Selects the Baby JubJub instantiation of `HoprPixSpec`; see `hopr-transport`'s `pix-bjj`.
pix-bjj = ["hopr-transport/pix-bjj"]
# Overrides `pix-bjj`, giving Ethereum deposit addresses that a plain transfer can reach.
#
# **This is what a consumer settling PIX deposits on-chain should enable.** Turning `pix-bjj` off
# with `default-features = false` is not sufficient and never was: features are additive, so
# the moment any crate in the graph pulls `hopr-lib` with defaults — a transitive dependency,
# or this workspace's own declaration — `pix-bjj` comes back on for everyone and the opt-out is
# silently undone. `pix-secp256k1` wins on addition instead, so it cannot be undone that way.
#
# **It is still a decision about the whole network, not about this node.** Curve choice sets the
# width of every curve-sized PIX field, so a node built this way cannot run a PIX Session with a
# `pix-bjj` peer: the Exit reads the announced `PixSuite` and refuses with `UnacceptablePixParams`.
# Nothing is negotiated, so choosing secp256k1 for settlement means choosing it for every peer the
# node exchanges PIX with. See `hopr-crypto-packet`'s feature comments for the full rule.
pix-secp256k1 = ["hopr-transport/pix-secp256k1"]
telemetry = [
  "hopr-transport/telemetry",
  "hopr-network-graph?/telemetry",
  "hopr-api/types-telemetry",
  "hopr-utils/telemetry",
]
fixed-rng = ["hopr-api/types-fixed-rng"]
runtime-tokio = [
  "hopr-utils/runtime-tokio",
  "hopr-utils/network-types-runtime-tokio",
  "hopr-transport/runtime-tokio",
  "hopr-utils/parallelize-runtime-tokio",
  "dep:tokio",
]
serde = [
  "dep:cfg_eval",
  "dep:humantime-serde",
  "dep:serde",
  "dep:serde_with",
  "hopr-api/serde",
  "hopr-utils/serde",
  "hopr-transport/serde",
]
session-client = ["hopr-api/node-session-client"]
explicit-path = ["session-client"]
session-server = ["hopr-api/node-session-server"]
transport-announce-quic = ["hopr-transport/p2p-announce-quic"]

# === utility features ===
utils_futures = []  # utility futures for async adapters
utils_parallel = [] # utility parallelization functionality

# In-process CPU profiling via pprof.  All ProfilerGuard methods are zero-cost
# no-ops when this feature is absent so the crate compiles cleanly without it.
profiling = ["dep:pprof"]

testing = [
  "session-server",
  "session-client",
  "runtime-tokio",
  "dep:bytesize",
  "dep:hex-literal",
  "dep:rand",
  "dep:rstest",
  "dep:tokio-util",
  "dep:hopr-ticket-manager",
  "dep:hopr-transport-p2p",
  "dep:hopr-chain-connector",
  "dep:hopr-ct-full-network",
  "dep:hopr-network-graph",
  "hopr-chain-connector/testing",
  "hopr-chain-connector/runtime-tokio",
  "hopr-transport-p2p/runtime-tokio",
  "hopr-transport-p2p/testing",
  "hopr-transport-p2p/transport-quic",
  "hopr-network-graph/petgraph",
  "hopr-network-graph/graph-api",
  "hopr-ticket-manager/redb",
] # testing related functionality

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
async-broadcast = { workspace = true }
backon = { workspace = true, features = ["futures-timer-sleep"] }
cfg_eval = { workspace = true, optional = true }
const_format = { workspace = true }
futures = { workspace = true }
futures-concurrency = { workspace = true }
futures-time = { workspace = true }
humantime-serde = { workspace = true, optional = true }
lazy_static = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, optional = true }
serde_with = { workspace = true, optional = true }
strum = { workspace = true }
smart-default = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
validator = { workspace = true }

bytesize = { workspace = true, optional = true }
hex-literal = { workspace = true, optional = true }
pprof = { version = "0.15.0", features = [
  "flamegraph",
  "frame-pointer",
], optional = true }
rand = { workspace = true, optional = true, features = ["std_rng"] }
rstest = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

hopr-api = { workspace = true, features = [
  "full",
  "types-random",
  "types-keypair",
] }

hopr-utils = { workspace = true, features = [
  "network-types",
  "parallelize",
  "parallelize-rayon",
  "platform",
] }
hopr-transport = { workspace = true }

hopr-ticket-manager = { workspace = true, optional = true }
hopr-transport-p2p = { workspace = true, optional = true }
hopr-chain-connector = { workspace = true, optional = true }
hopr-ct-full-network = { workspace = true, optional = true }
hopr-network-graph = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
futures = { workspace = true }
insta = { workspace = true }
rand = { workspace = true }
rstest = { workspace = true }
serial_test = { workspace = true }
serde-saphyr = { workspace = true }
test-log = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
opentelemetry-prometheus-text-exporter = { workspace = true }
opentelemetry_sdk = { workspace = true, features = [
  "metrics",
  "experimental_metrics_custom_reader",
  "testing",
] }

hopr-api = { workspace = true, features = ["types-random", "types-telemetry"] }
hopr-chain-connector = { workspace = true, features = [
  "testing",
  "runtime-tokio",
] }
hopr-ct-full-network = { workspace = true }
hopr-utils = { workspace = true, features = ["runtime-tokio"] }


[package.metadata.cargo-machete]
# humantime-serde: used via serde attribute macros, not a direct import.
# pprof: used only behind #[cfg(feature = "profiling")], which machete may not scan.
ignored = ["humantime-serde", "pprof"]

[package.metadata.cargo-shear]
ignored = ["humantime-serde"]
