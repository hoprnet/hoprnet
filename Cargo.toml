[workspace]

resolver = "2"

members = [
  "crypto/packet",
  "hopr/hopr-lib",
  "protocols/app",
  "protocols/hopr",
  "protocols/pix",
  "protocols/session",
  "protocols/start",
  "transport/hopr",
  "transport/mixer",
  "transport/probe",
  "transport/session",
  "transport/tag-allocator",
  "utils-session",
]

[workspace.package]
rust-version = "1.91"
edition = "2024"
authors = ["HOPR Association <tech@hoprnet.org>"]
license = "GPL-3.0-only"
homepage = "https://hoprnet.org/"
repository = "https://github.com/hoprnet/hoprnet"

[workspace.metadata.publish]
order = [
  "hopr-crypto-packet",
  "hopr-protocol-app",
  "hopr-protocol-start",
  "hopr-transport-tag-allocator",
  "hopr-transport-mixer",
  "hopr-protocol-hopr",
  "hopr-protocol-session",
  "hopr-transport-probe",
  "hopr-transport-session",
  "hopr-transport",
  "hopr-lib",
  "hopr-utils-session",
]

[workspace.dependencies]
ahash = "0.8.12"
anyhow = "1.0.104"
aquamarine = "0.6.0"
async-broadcast = "0.7.2"
async_channel_io = "0.3.0"
async-trait = "0.1.91"
asynchronous-codec = { version = "0.7.0" }
auto_impl = "1.3.0"
backon = { version = "1.6.0", default-features = false }
base64 = "0.22.1"
bimap = "0.6.3"
bitvec = "1.1.1"
bloomfilter = { version = "3.0.1" }
bytesize = { version = "2.4.2", features = ["serde"] }
bytes = "1.12.1"
cfg-if = "1.0.4"
cfg_eval = "0.1.2"
clap = { version = "4.6.4", features = ["derive", "env", "string"] }
const_format = "0.2.36"
const-hex = "1.19.1"
criterion = { version = "0.8.2", default-features = false, features = [
  "cargo_bench_support",
  "async_tokio",
] }
crossfire = { version = "3.1.19", default-features = false }
dashmap = { version = "6.2.1", features = ["inline"] }
elliptic-curve-tools = "0.3.0"
flagset = "0.4.7"
futures = { version = "0.3.33", default-features = false, features = [
  "std",
  "async-await",
] }
futures-concurrency = "7.7.1"
futures-time = "3.1.0"
futures-timer = "3.0.4"
halfbrown = "0.4.0"
hashbrown = "0.17.1"
hex-literal = "1.1.0"
human-bandwidth = { version = "0.1.4", features = ["serde"] }
humantime-serde = "1.1.1"
indexmap = { version = "2.14.0" }
insta = { version = "1.48.0", features = ["yaml", "redactions"] }
lazy_static = "1.5.0"
libp2p = { version = "0.56.0", default-features = false }
mimalloc = { version = "0.1.52", default-features = false, features = [
  "secure",
] }
mockall = "0.15.0"
moka = { version = "0.12.15", features = ["future", "sync"] }
more-asserts = "0.3.1"
multiaddr = "0.18.2"
oas3 = "0.22.0"
opentelemetry-prometheus-text-exporter = { version = "0.3" }
opentelemetry_sdk = { version = "0.32.1" }
parameterized = "2.0.0" # ignored in renovate, kept back to 2.0.0 due to conflict with indexmap
parking_lot = "0.12.5"
pcap-file = "2.0.0"
pid = "4.0.0"
pin-project = "1.1.13"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
proc-macro-regex = "~1.1.0"
rand = { version = "0.10.2", features = ["thread_rng"] }
rand_distr = "0.6.0"
ringbuffer = "0.16.0"
rstest = { version = "0.26.1" }
rust-stream-ext-concurrent = "2.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_cbor_2 = "0.13.0"
serde_json = "1.0.151"
serde_repr = "0.1.21"
serde-saphyr = "1.0.1"
serde_with = { version = "3.21.0", features = ["base64"] }
serial_test = "4.0.1"
smart-default = "0.7.1"
strum = { version = "0.28.0", features = ["derive"] }
subtle = "2.6.1"
temp-env = "0.3.6"
test-log = { version = "0.2.21", features = ["trace"] }
thiserror = "2.0.19"
tikv-jemallocator = "0.7.0"
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "tracing",
] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tokio-util = { version = "0.7.19", default-features = false, features = [
  "codec",
  "compat",
] }
tracing = { version = "0.1.44", features = ["release_max_level_debug"] }
validator = { version = "0.21.0", features = ["derive"] }
vsss-rs = { version = "6.0.1", default-features = false }

hopr-api = "1.20.0"
hopr-types = { version = "2.2.1", features = ["use-bindings"] }
hopr-utils = { package = "hopr-utilities", version = "0.6.0", default-features = false }
hopr-utils-session = { version = "1.2.1", path = "utils-session" }

# `bjj` is deliberately not enabled here. Hard-enabling it on the workspace dependency
# makes it unreachable for downstream consumers — Cargo features are additive, so no
# dependent can turn it back off. It is instead forwarded through `hopr-transport` and
# `hopr-lib`, both of which keep it in their `default` set, so building any hoprnet
# crate directly is unchanged.
hopr-crypto-packet = { version = "1.4.0", path = "crypto/packet", default-features = false, features = [
  "ed25519",
] }
hopr-lib = { version = "4.0.2-rc.10", path = "hopr/hopr-lib" }
hopr-protocol-app = { version = "1.0.1", path = "protocols/app", default-features = false }
hopr-protocol-hopr = { version = "4.7.0", path = "protocols/hopr", default-features = false, features = [
  "rayon",
] }
hopr-protocol-pix = { version = "0.1.0", path = "protocols/pix", default-features = false, features = [
  "rayon",
] }
hopr-protocol-session = { version = "1.2.0", path = "protocols/session", default-features = false }
hopr-protocol-start = { version = "1.1.0", path = "protocols/start", default-features = false }
hopr-ticket-manager = "0.5.1"
hopr-transport = { version = "0.37.0", path = "transport/hopr" }
hopr-transport-mixer = { version = "0.4.1", path = "transport/mixer", default-features = false }
hopr-transport-probe = { version = "0.8.0", path = "transport/probe", default-features = false }
hopr-transport-session = { version = "0.25.0", path = "transport/session", default-features = false }
hopr-transport-tag-allocator = { version = "0.1.1", path = "transport/tag-allocator", default-features = false }
hopr-chain-connector = "0.22.1"

# referential implementations (published to crates.io)
hopr-session-server-forwarder = { version = "0.1.0", default-features = false }
hopr-transport-p2p = { version = "0.9.4", features = ["transport-quic"] }
hopr-ct-full-network = { version = "0.3.0", default-features = false }
hopr-network-graph = { version = "0.3.1", default-features = false }

[profile.dev]
panic = "abort"

# this profile focuses on the speed of compilation
[profile.candidate]
inherits = "release"
codegen-units = 16   # normal release default
lto = false          # do the smallest amount of link-time optimization
panic = "abort"
strip = true
opt-level = 2

# perform minimal optimizations to prevent stack overflows in large tests
[profile.test]
opt-level = 1

# CI keeps useful line-level backtraces while avoiding large incremental and
# full debug-info artifacts in the Nix binary cache.
[profile.ci-test]
debug = 1
incremental = false
inherits = "test"

# this profile focuses on the best runtime performance and the smallest binary size
[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
opt-level = 3
strip = true

# memory profiling profile — inherits release optimizations but preserves debug symbols
# for jeprof symbol resolution
[profile.memprof]
inherits = "release"
debug = 2
strip = false

# uses extended debug symbols for profiling but does not harm benchmarking performance
[profile.bench]
debug = 2
split-debuginfo = "off"
strip = false

# CPU profiling profile — release performance with full DWARF symbols.
# Use with `cargo flamegraph --profile profiling` (Linux) or the pprof
# in-process feature (`--features profiling`).  Mirrors [profile.memprof]
# which is used for allocation profiling.
[profile.profiling]
inherits = "release"
debug = 2
strip = false
split-debuginfo = "packed"

# make insta snapshots faster
[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3

[workspace.metadata.cargo-shear]
ignored = ["oas3", "hopr-session-server-forwarder", "hopr-utils-session"]
